    <path d="M 28 44 C 48 58 56 42 56 36 C 58 64 34 76 26 68 C 22 62 24 50 28 44 Z" fill="#FFFFFF" stroke="#101010" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right Eye -->
    <path d="M 100 44 C 80 58 72 42 72 36 C 70 64 94 76 102 68 C 106 62 104 50 100 44 Z" fill="#FFFFFF" stroke="#101010" stroke-width="5" stroke-linejoin="round"/>
