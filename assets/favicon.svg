<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#101010" stroke-width="4"/>
  <!-- Web Lines -->
  <g stroke="#101010" stroke-width="2.5" opacity="0.4" fill="none">
    <path d="M64 4 V124 M4 64 H124 M21 21 L107 107 M21 107 L107 21"/>
    <circle cx="64" cy="64" r="20"/>
    <circle cx="64" cy="64" r="40"/>
  </g>
