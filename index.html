});
const MOUSE = { x: 0, y: 0, targetX: 0, targetY: 0, active: false };

/* Track the cursor ANYWHERE on the page, measured from the stage centre, so his gaze follows the
   pointer over the cards, the header and the margins too — not just while it is over the stage.
   Binding to the stage alone (and recentring on pointerleave) meant his head snapped back to centre
   the moment the cursor moved onto a quote card, which read as the tracking being broken. The yaw/
   pitch are clamped downstream, so allowing the normalised target past ±1 just lets an off-stage
   cursor still pull his gaze fully to that side. */
function updateMouseTarget(e){
  const rect = stage.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  MOUSE.targetX = clamp(((e.clientX - rect.left) - rect.width * 0.5) / (rect.width * 0.5), -1.6, 1.6);
  MOUSE.targetY = clamp(((e.clientY - rect.top)  - rect.height * 0.5) / (rect.height * 0.5), -1.6, 1.6);
  MOUSE.active = true;
}
window.addEventListener("pointermove", updateMouseTarget, { passive: true });

/* Only recentre when the cursor actually leaves the window (no relatedTarget on the way out),
   not every time it crosses onto a child element. */
document.addEventListener("pointerout", e => {
  if(!e.relatedTarget){ MOUSE.targetX = 0; MOUSE.targetY = 0; }
});

const NO_DRAG_SELECTOR = ".play-controls-overlay, .dots, button, [role='tab']";
stage.addEventListener("pointerdown", e => {
  if(e.target.closest && e.target.closest(NO_DRAG_SELECTOR)) return;
  if(drag.active) return;
  drag.active=true; drag.id=e.pointerId;
  drag.x0=e.clientX; drag.scroll0=scroll; drag.dx=0; drag.moved=false;
  drag.lastX=e.clientX; drag.lastT=performance.now(); drag.vel=0;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if(!drag.active || e.pointerId!==drag.id) return;
  drag.dx=e.clientX-drag.x0;
  if(Math.abs(drag.dx)>4){ drag.moved=true; killHint(); }
  const now=performance.now(), dt=Math.max(8, now-drag.lastT);
  /* velocity off the last two events alone is very noisy at high pointer rates, which made
     flick detection fire inconsistently; keep a running average so a flick reads as a flick */
  const raw=(e.clientX-drag.lastX)/dt*1000;
  drag.vel = drag.vel===0 ? raw : lerp(drag.vel, raw, 0.32);
  drag.lastX=e.clientX; drag.lastT=now;
  scroll=drag.scroll0-drag.dx;
  target=scroll;
});
function endDrag(e){
  if(!drag.active || (e && e.pointerId!==drag.id)) return;
  drag.active=false;
  const frac=-drag.dx/step;
  let i=Math.round(drag.scroll0/step);
  if(Math.abs(drag.vel)>CFG.motion.flickThreshold) i += drag.vel<0 ? 1 : -1;
  else if(Math.abs(frac)>CFG.motion.dragThreshold)  i += frac>0 ? 1 : -1;
  target=i*step;
  announce(i);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* =====================================================================
   POSE — Spider-Man: braced two-handed hold vs effortful web-thread hauling
   =====================================================================
   IDLE is not "standing around": he is still carrying the weight of five
   loaded cards, so both fists stay closed on the line in a staggered
   tug-of-war grip (lead hand out along the rope, trail hand in near the
   hip), hips sat back, knees soft, torso countering the pull. Only breath
   and small weight shifts move.
   PULLING: deeper crouch, stronger backward lean, wide diagonal arm
   trajectory, shoulder twist into the pull — real exertion. */
const _gT=new THREE.Vector3(), _pole=new THREE.Vector3(), _axis=new THREE.Vector3(0,0,1);
const _hipQ=new THREE.Quaternion(), _hipOff=new THREE.Vector3();
const _hipPos=new THREE.Vector3(), _hipScl=new THREE.Vector3();

/* Offset the hips by a world-space amount in stage pixels.
   This rig is Z-up (the pelvis rest offset is [0, 0.006, 1.053] — its height is on local Z),
   so the old code, which nudged `hips.position.y` by a multiple of `restHip.y`, was scaling
   every crouch by 0.006 instead of ~1.05 and pushing it along the wrong axis. The squat,
   the hip drop and the weight shift were all effectively zero, which is why the knees never
   unlocked. Converting through the parent's world rotation keeps this correct on any rig. */
function offsetHips(downPx, backPx, sidePx){
  const B=HUMAN.B;
  if(!B.Hips || !HUMAN.restHip) return;
  B.Hips.position.copy(HUMAN.restHip);
  const parent = B.Hips.parent;
  if(!parent) return;
  /* decompose rather than assume HUMAN.scale: this GLB nests the armature under Sketchfab /
     FBX wrapper nodes that carry their own scale, so the cumulative factor is not the one we
     set on the root */
  parent.updateWorldMatrix(true,false);
  parent.matrixWorld.decompose(_hipPos, _hipQ, _hipScl);
  const s = (Math.abs(_hipScl.x)+Math.abs(_hipScl.y)+Math.abs(_hipScl.z))/3;
  if(!(s>1e-9)) return;
  _hipOff.set(sidePx, -downPx, backPx).applyQuaternion(_hipQ.invert()).divideScalar(s);
  B.Hips.position.add(_hipOff);
}

function handStroke(phase){
  const p=((phase%1)+1)%1, pullEnd=0.65;
  if(p<pullEnd){
    const k=easeIO(p/pullEnd);
    return { s: k, out: 0, grip: 1, drive: Math.sin(Math.PI*(p/pullEnd)) };
  }
  const k=easeIO((p-pullEnd)/(1-pullEnd));
  return { s: 1-k, out: Math.sin(Math.PI*k)*1.2, grip: 0.15, drive: 0 };
}

function poseHuman(dt){
  const B=HUMAN.B, R=HUMAN.rest, grip=gripPoint;

  const idle = 1 - clamp(effortS*3.5, 0, 1);

  /* --- holdBlend: 1 = braced hold, 0 = mid-haul. Eased rather than snapped so the
         transition in and out of a stroke reads as a shift of weight, not a cut. --- */
  const holdTarget = clamp(1 - effortS*4.2, 0, 1);
  waveBlend = lerp(waveBlend, holdTarget, 1 - Math.pow(0.015, dt));
  const wb = clamp(waveBlend, 0, 1);
  const pb = 1 - wb;    // pull blend

  /* slow idle life: a long breath and a much slower secondary sway, so nothing ticks */
  const breathe = Math.sin(T*0.85);
  const sway    = Math.sin(T*0.33 + 0.7);
  /* teen idle micro-animation: slow weight shift and casual head/hand movement */
  const teenSway   = Math.sin(T * 1.05);          // weight shift, ~6s full cycle
  const headLook   = Math.sin(T * 0.785);          // slow head turn, ~8s cycle
  const headTilt   = Math.sin(T * 0.52 + 0.8);     // slow head tilt, ~12s cycle
  const handDriftT = T * 0.9;                      // micro-drift on idle hands

  leanV += ((effortS - leanS)*CFG.human.leanK - leanV*CFG.human.leanC)*dt;
  leanS = clamp(leanS + leanV*dt, 0, 1.6);
  const E = leanS;
  headLag = lerp(headLag, leanS, 1-Math.pow(0.02, dt));

  let hx=anchorR.x-grip.x, hy=anchorR.y-grip.y;
  const hlen=Math.hypot(hx,hy)||1, rdx=hx/hlen, rdy=hy/hlen;

  const A=handStroke(u), Bs=handStroke(u+0.5);
  const stroke=Math.max(A.drive,Bs.drive);
  const decay = 1-Math.pow(CFG.human.gripK, dt);

  /* --- FINGER POSING ---
     Both fists stay closed on the line at all times. During a stroke each hand releases
     only on its own recovery arc (handStroke.grip drops to 0), so there is always one
     hand loaded — a hand that opens in mid-air holding nothing was the main thing that
     read as "not actually gripping". A fist never opens past 0.55. */
  const hauling = clamp(effortS*4, 0, 1);
  gripS.Left  = lerp(gripS.Left,  Math.max(A.grip,  wb), decay);
  gripS.Right = lerp(gripS.Right, Math.max(Bs.grip, wb * 0.6), decay);
  setGrip("Left",  0.55 + 0.45*gripS.Left);
  setGrip("Right", 0.42 + 0.58*gripS.Right);
  const reach = HUMAN.reach;

  /* --- PULL trajectory: authentic horizontal hand-over-hand cable haul --- */
  /* Haul stroke stays on/near the horizontal rope line (reach point -> pull-back point) */
  const reachPt = { x: grip.x + reach*0.28, y: grip.y + reach*0.02 };
  const pullPt  = { x: grip.x - reach*0.20, y: grip.y + reach*0.08 };
  
  const alongPull = (st, out) => ({
    x: lerp(reachPt.x, pullPt.x, st) + out*reach*0.08,
    y: lerp(reachPt.y, pullPt.y, st) - out*reach*0.06
  });

  /* --- STAGGER EFFECT ("Man Pulling Rope with stagger"): High-frequency ratchet jitter under heavy load --- */
  const staggerAmp = 2.6 * pb * stroke * clamp(effortS * 3.0, 0, 1.2);
  const staggerX   = (Math.sin(T * 58) * 0.65 + (Math.random() - 0.5) * 0.7) * staggerAmp;
  const staggerY   = (Math.cos(T * 52) * 0.45 + (Math.random() - 0.5) * 0.5) * staggerAmp;

  const gA = alongPull(A.s, A.out);   gA.out = A.out;   gA.st = A.s;
  const gB = alongPull(Bs.s, Bs.out); gB.out = Bs.out;  gB.st = Bs.s;
  
  /* Apply stagger ratchet offset during active haul strokes */
  if(A.grip > 0.5){ gA.x += staggerX; gA.y += staggerY; }
  if(Bs.grip > 0.5){ gB.x += staggerX; gB.y += staggerY; }

  for(const k of ["Hips","Spine","Spine1","Spine2","Spine3","Neck","Head",
                  "LeftShoulder","LeftArm","LeftForeArm","LeftHand",
                  "RightShoulder","RightArm","RightForeArm","RightHand",
                  "LeftUpLeg","LeftLeg","LeftFoot","RightUpLeg","RightLeg","RightFoot"]){
    if(B[k]) B[k].quaternion.copy(R[k]);
  }

  /* --- HIPS: upright, straight posture ("not a big job for Spidey") --- */
  const pullLoad = clamp(0.20 + 0.50*stroke, 0, 1) * (0.35 + 0.65*E);
  const load = pullLoad * pb;
  const legL = HUMAN.legLen || HUMAN.armLen*1.55 || 1;

  /* Keep posture tall and upright: minimal hip drop, upright hips */
  const dropPx = legL * (0.05 + 0.03*load + 0.02*wb*teenSway*teenSway) - legL*0.01*wb*breathe;
  const backPx = legL * (0.03 + 0.02*load);
  const sidePx = legL * (0.018 * wb * sway + 0.04 * wb * teenSway);
  offsetHips(dropPx, backPx, sidePx);
  B.Hips.quaternion.copy(R.Hips)
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), 0.06*load))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), wb * 0.06 * (1 + 0.3*teenSway)))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), wb * 0.03 * teenSway));

  /* --- SPINE & SHOULDERS: straight, effortless superhero stance --- */
  const leanEach = -0.02 * wb;
  const breath = breathe*0.018*idle;
  const idleTwist = wb * 0.04 * sway;

  /* Subtle shoulder protraction */
  if(B.LeftShoulder){
    B.LeftShoulder.quaternion.copy(R.LeftShoulder)
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), -0.08 * pb * A.grip))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), 0.05 * pb * stroke));
  }
  if(B.RightShoulder){
    B.RightShoulder.quaternion.copy(R.RightShoulder)
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), 0.08 * pb * Bs.grip))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), -0.05 * pb * stroke));
  }

  for(const [k,w,si] of [["Spine",1.0,0],["Spine1",0.85,1],["Spine2",0.65,2],["Spine3",0.5,3]]){
    if(!B[k]) continue;
    const sCurve = wb * (si < 2 ? -0.02 * w : 0.03 * w);
    const shoulderDrop = wb * (si >= 2 ? 0.02 * teenSway : 0);
    const pullBendX = 0;   // straight spine, effortless pull
    const pullTwistY = pb * 0.06 * w * stroke;

    B[k].quaternion.copy(R[k])
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), breath*w + sCurve + pullBendX))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), leanEach*w))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), (0.04*w*(1-stroke)*pb + idleTwist*w + pullTwistY)))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), stroke*0.05*w*pb + shoulderDrop))
      .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), wb * 0.015 * w * teenSway));
  }
  /* --- MOUSE POINTER HEAD TRACKING ---
     Snappier follow: base 1e-6 converges ~95% in ~0.22s (was 0.001 → ~0.45s, which lagged enough
     that a quick cursor move barely moved him and read as "not tracking"). Frame-rate independent,
     so it behaves the same on a 20fps low-end device as at 60fps. Slightly wider yaw/pitch so the
     turn is unmistakable. */
  const mouseDecay = 1 - Math.pow(0.000001, dt);
  MOUSE.x = lerp(MOUSE.x, MOUSE.targetX, mouseDecay);
  MOUSE.y = lerp(MOUSE.y, MOUSE.targetY, mouseDecay);

  const mousePitch = clamp(-MOUSE.y * 0.42, -0.48, 0.48);
  const mouseYaw   = clamp(MOUSE.x * 0.62, -0.72, 0.72);
  const mouseRoll  = clamp(MOUSE.x * 0.09, -0.14, 0.14);

  const micHeadWeight = MIC_STATE.phase === "HELD" || MIC_STATE.phase === "CATCH" ? 0.25 : 1.0;
  const lookPitch = mousePitch * micHeadWeight;
  const lookYaw   = (wb * (-0.08 + 0.10*headLook) + mouseYaw) * micHeadWeight;
  const lookRoll  = (wb * (0.04 * headTilt) + mouseRoll) * micHeadWeight;

  /* --- HEAD: confident superhero head tracking mouse pointer --- */
  if(B.Neck) B.Neck.quaternion.copy(R.Neck)
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), lerp(-0.02 + 0.02*breathe, 0.04, pb) + lookPitch * 0.45))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), lookYaw * 0.45))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), lookRoll * 0.45));
  if(B.Head) B.Head.quaternion.copy(R.Head)
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(1,0,0), lerp(-0.02 + 0.02*breathe, 0.03, pb) + lookPitch * 0.55))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,1,0), lookYaw * 0.55 + wb * 0.04 * sway))
    .multiply(new THREE.Quaternion().setFromAxisAngle(_axis.set(0,0,1), lookRoll * 0.55 + wb * 0.03 * breathe));

  HUMAN.root.updateMatrixWorld(true);

  /* --- ARMS --- */
  captureBind(["LeftArm","LeftForeArm","LeftHand","RightArm","RightForeArm","RightHand"]);
  captureHandBind();
  const armZ = 35;
  /* Orient the fists along the LINE they are holding, not along the stroke trajectory.
     This used to use grip->gripLow (the down-and-back pull path, ~60° off horizontal), so
     both wrists were rolled as if gripping a steeply diagonal rope while the visible thread
     ran flat across the frame — which is what read as twisted hands. rdx/rdy already point
     from the grip toward the load; screen y is inverted relative to world y. */
  const ropeDirW = HAND.w.set(rdx, -rdy, 0.06).normalize();

  /* Braced hold targets. Both sit ON the line (y === grip.y, give or take the small sag a
     loaded hand puts in it) and are staggered along it like a tug-of-war grip: the lead
     hand out toward the load, the trail hand drawn back in near the hip. The old idle
     dropped the left hand 0.42 of an arm-length BELOW the rope, so it visibly held nothing. */
  /* micro-drift: tiny lazy circular motion so idle hands don't look frozen */
  const driftLX = wb * Math.sin(handDriftT) * 2.0;
  const driftLY = wb * Math.cos(handDriftT * 1.3) * 1.5;
  const holdLead  = { x: grip.x + reach*0.12 + driftLX, y: grip.y + reach*0.08 + breathe*reach*0.018 + driftLY };
  /* trail hand stays anchored on the rope line near the chest */
  const driftRX = wb * Math.sin(handDriftT * 0.8 + 1.5) * 2.5;
  const driftRY = wb * Math.cos(handDriftT * 1.1 + 0.7) * 2.0;
  const holdTrail = { x: grip.x - reach*0.04 + driftRX, y: grip.y + reach*0.06 + breathe*reach*0.015 + driftRY };

  if(HAND.ready){
    /* === LEFT ARM: lead hand, always closed on the thread === */
    const handL = B.LeftHand;
    if(handL && HUMAN.bind.LeftArm){
      const lx = lerp(gA.x, holdLead.x, wb);
      const ly = lerp(gA.y, holdLead.y, wb);
      /* This is the far-side arm (its shoulder sits ~110 behind the near one), so it needs a
         much larger forward push than the near arm to clear the chest: at armZ+14 the hand
         landed at z 55 against a body centre of 48, i.e. inside the torso, and the elbow
         finished behind it. */
      const lzOut = Math.max(105, armZ + 40 + lerp(gA.st*25 + (gA.out||0)*16, 50, wb));
      gA.z = lzOut;
      handGripQuat("Left", ropeDirW, HAND.q);
      HAND.v.copy(HAND.xL.Left).applyQuaternion(HAND.q).multiplyScalar(HAND.palm.Left);
      _gT.set(vx(lx) - HAND.v.x, vy(ly) - HAND.v.y, lzOut - HAND.v.z);
      /* elbow breaks away naturally down and back toward the lats */
      _pole.set(-0.25, lerp(-0.85, -0.65, wb), lerp(-0.5, -0.65, wb)).normalize();
      solveLimb("LeftArm", "LeftForeArm", "LeftHand", _gT, _pole, 0);
      setBoneWorldQuat(handL, HAND.q);
    }

    /* === RIGHT ARM: trail hand on the line, or the microphone === */
    const handR = B.RightHand;
    if(handR && HUMAN.bind.RightArm){
      /* Base hold position on rope: minimum 105px zOut depth clearance so hand never enters chest */
      const rxBase = lerp(gB.x, holdTrail.x, wb);
      const ryBase = lerp(gB.y, holdTrail.y, wb);
      const pullZOffset = lerp(gB.st*30 + (gB.out||0)*20, 60, wb);
      const zOutBase = Math.max(105, armZ + 45 + pullZOffset);

      /* ---- Right-arm mic choreography, as one timeline ----
             on the rope, fist closed
          -> lets go, opens, and DIPS down                    FLY_IN, first ~40%
          -> swings up to intercept the incoming mic          FLY_IN, remainder
          -> closes around it                                 CATCH
          -> holds it at the mask                             HELD
          -> opens, the mic falls out of the hand             DROP
          -> comes straight back down onto the rope           DROP fade
         One weight says how far the arm is off the line, one point says where it goes. The
         previous version stacked a frozen release pose, a second release clock and a separate
         wrist-swing blend on top of this, which is what made the drop unreadable. */
      const relT = MIC_STATE.releaseT;
      const dropping = relT >= 0 && MIC_STATE.releasePose;
      const DROP_RETURN = 0.45;                       // hand is back on the rope this fast

      let micW = 0, wristW = 0, micHandX = rxBase, micHandY = ryBase, micHandZ = zOutBase, gripVal = 1.0;

      if(dropping){
        micW = 1 - easeIO(clamp(relT / DROP_RETURN, 0, 1));
        wristW = micW;
        micHandX = MIC_STATE.releasePose.x;
        micHandY = MIC_STATE.releasePose.y;
        micHandZ = Math.max(105, MIC_STATE.releasePose.z);
        gripVal  = lerp(0.92, 0.12, clamp(relT / 0.10, 0, 1));   // let go, then stay open
      } else if(MIC_STATE.active){
        const ph = MIC_STATE.phase;
        if(ph === "FLY_IN"){
          const u = easeIO(clamp(MIC_STATE.t / 0.60, 0, 1));     // direct smooth rise arc to catch target
          micW = u;
          wristW = u;
          micHandX = lerp(rxBase, MIC_STATE.pos.x, u);
          micHandY = lerp(ryBase, MIC_STATE.pos.y + 12, u);
          micHandZ = Math.max(105, lerp(zOutBase, MIC_STATE.pos.z, u));
          gripVal  = 0.12;                                       // open receiving palm, waiting for mic
        } else {                                                 // CATCH / HELD
          micW = 1;
          wristW = 1;
          micHandX = MIC_STATE.pos.x;
          micHandY = MIC_STATE.pos.y + 12;
          micHandZ = Math.max(105, MIC_STATE.pos.z);
          gripVal  = ph === "CATCH"
            ? lerp(0.12, 0.92, easeIO(clamp(MIC_STATE.t / 0.10, 0, 1)))   // snaps shut on contact
            : 0.92;
        }
      }

      const rx = lerp(rxBase, micHandX, micW);
      const ry = lerp(ryBase, micHandY, micW);
      const zOut = lerp(zOutBase, micHandZ, micW);
      gB.z = zOut;

      if(micW > 0.001){
        /* roll the wrist between the rope grip and the mic grip rather than switching styles */
        handGripQuat("Right", ropeDirW, _qRope);
        micGripQuat("Right", MIC_STATE.rotZ || 0.42, _qMic);
        HAND.q.copy(_qRope).slerp(_qMic, wristW);   // wrist rolls in on the rise, not with micW
        setMicGrip(lerp(1.0, gripVal, micW));       // -> a rope fist again as micW decays
      } else {
        handGripQuat("Right", ropeDirW, HAND.q);
        setGrip("Right", 1.0);
      }
      HAND.v.copy(HAND.xL.Right).applyQuaternion(HAND.q).multiplyScalar(HAND.palm.Right);
      _gT.set(vx(rx) - HAND.v.x, vy(ry) - HAND.v.y, zOut - HAND.v.z);
      
      /* Elbow swings OUT and slightly forward to keep the upper arm off the ribs, but stays
         DOWN. The old target flared it to +0.35 in Y, which lifted the elbow above his head —
         correct for the head-scratch gesture this pole was originally tuned for, absurd for
         raising a mic to your mouth, where the elbow hangs by the ribs and only the forearm
         travels. Same pole serves the catch, the hold and the drop. */
      const activeW = micW;
      const poleX = lerp(-0.15,  0.50, activeW);
      const poleY = lerp(-0.95, -0.70, activeW);
      const poleZ = lerp(-0.35,  0.25, activeW);
      _pole.set(poleX, poleY, poleZ).normalize();

      solveLimb("RightArm", "RightForeArm", "RightHand", _gT, _pole, 0);
      setBoneWorldQuat(handR, HAND.q);
    }
  }

  /* --- LEGS: wider stance under strain, relaxed when idle --- */
  const fY = humanGroundY;
  footDrift = Math.min(CFG.human.maxDrift * lerp(1.25, 1, wb), footDrift + effortS*CFG.human.driftPerTension*dt);
  if(!STEP.active && footDrift - Math.min(footOff.Left, footOff.Right) > CFG.human.maxDrift*0.7){
    STEP.active = true;
    STEP.t = 0;
    STEP.side = STEP.side === "Left" ? "Right" : "Left";
    STEP.from = footOff[STEP.side];
    STEP.to   = footDrift;
  }
  let stepLift = 0;
  if(STEP.active){
    STEP.t += dt/CFG.human.stepDur;
    const k = clamp(STEP.t, 0, 1);
    footOff[STEP.side] = lerp(STEP.from, STEP.to, easeIO(k));
    stepLift = Math.sin(Math.PI*k)*CFG.human.stepLift;
    if(STEP.t >= 1){
      STEP.active = false;
      const m = Math.min(footOff.Left, footOff.Right);
      if(m > 0){ footOff.Left -= m; footOff.Right -= m; footDrift -= m; }
    }
  }

  /* idle stance widens: front foot further forward, both feet spread for casual weight shift */
  const idleSpread = wb * legL * 0.045;
  const plant = {
    Left : { x: humanX + HUMAN.stanceFront + footDrift - footOff.Left + idleSpread,  y: fY - (STEP.active&&STEP.side==="Left"  ? stepLift : 0) },
    Right: { x: humanX - HUMAN.stanceBack  + footDrift - footOff.Right - idleSpread*0.3, y: fY - (STEP.active&&STEP.side==="Right" ? stepLift : 0) },
  };

  captureBind(["LeftUpLeg","LeftLeg","LeftFoot","RightUpLeg","RightLeg","RightFoot"]);
  for(const side of ["Left","Right"]){
    if(!B[side+"UpLeg"]) continue;
    const pt=plant[side], front = side==="Left";
    _gT.set(vx(pt.x), vy(pt.y), (front ? 30 + wb*10 : -34 - wb*6));
    _pole.set(front ? 0.35 : 0.15, front ? 0.75 : 0.65, front ? 0.6 : 0.4).normalize();
    const lift = STEP.active && STEP.side===side ? 0.5 : 0;
    solveLimb(side+"UpLeg", side+"Leg", side+"Foot", _gT, _pole, 0.92 - lift*0.6);
  }

  /* --- thread bending & high-frequency tension ripples + stagger during superhero haul --- */
  for(const [g, gp] of [[gA, A.grip * pb], [gB, Bs.grip * pb]]){
    if(gp < 0.35) continue;
    const sArc = (g.x - anchorL.x) * lenRatio;
    if(sArc < 14 || sArc > rope.cum[rope.cum.length-1]-14) continue;
    const loc = atLength(sArc);
    /* High-frequency tension wave & stagger ratchet running along web thread */
    const tensionRipple = Math.sin(T * 42 + sArc * 0.05) * 6 * stroke * pb + staggerY * 1.5;
    addForceAt(loc, staggerX * 0.8, (g.y - loc.y) * CFG.human.ropeBend * 1.4 * gp + tensionRipple);
  }

  /* --- rope end yank --- */
  tugPulse = stroke*E;
  const yank = CFG.rope.tugAmp * 1.3 * tugPulse;   // more pronounced yank
  anchorL.x = anchorBase.x - rdx*yank;
  anchorL.y = anchorBase.y - rdy*yank;

  const lo = A.s >= Bs.s ? gA : gB, hi = A.s >= Bs.s ? gB : gA;
  fistHi.x = hi.x; fistHi.y = hi.y; fistHi.z = hi.z || 0;
  fistLo.x = lo.x; fistLo.y = lo.y; fistLo.z = lo.z || 0;
  fistW.x = hi.x;  fistW.y = hi.y;

  /* sweat off the brow */
  if(!reduced && B.Head){
    const hp = bonePos(B.Head, IK.v0);
    foreheadAbs = { x: hp.x + W/2, y: H/2 - hp.y };
    sweatTimer -= dt;
    if(E>0.42 && sweatTimer<=0){ sweatTimer=lerp(0.26,0.11,E); spawnSweat(E); }
  }
}

function spawnSweat(E){
  const d=sweat.find(s=>s.life<=0); if(!d) return;
  const sc = HUMAN.scale*100;
  d.x=foreheadAbs.x+(Math.random()*12-6);
  d.y=foreheadAbs.y-6+(Math.random()*8-4);
  d.z=40+Math.random()*30;
  d.vx=(60+Math.random()*110)*(0.6+E);
  d.vy=(-110-Math.random()*130)*(0.6+E);
  d.life=0.8+Math.random()*0.4;
  d.r=2.6+Math.random()*1.6;
  d.m.visible=true;
}
function stepParticles(dt){
  for(const d of sweat){
    if(d.life<=0){ if(d.m.visible) d.m.visible=false; continue; }
    d.life-=dt; d.vy+=1000*dt;
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    d.mat.opacity=0.92*clamp(d.life*1.5,0,1);
    const stretch=clamp(1+Math.abs(d.vy)/900,1,1.8);
    d.m.position.set(vx(d.x), vy(d.y), d.z);
    d.m.scale.set(d.r, d.r*stretch, d.r);
    d.m.rotation.z=-Math.atan2(d.vy,d.vx)-Math.PI/2;
  }
}

/* =====================================================================
   CLOTH: hang each card off the line, blow wind through it
   ===================================================================== */
function placeCards(dt){
  const total=DATA.length*step;
  /* wind energy: ambient gust plus whatever Jerry is putting into the line */
  const windE=clamp(0.34 + gust*0.7 + effortS*0.8, 0, 1.35);  // always a live breeze

  for(let ci=0; ci<cards.length; ci++){
    const c=cards[ci];
    const k=Math.round((scroll-ci*step)/total);
    const sMid=s0+(ci*step+k*total-scroll)*lenRatio;
    const half=span*0.5*lenRatio;
    const aL=atLength(sMid-half), aR=atLength(sMid+half);
    const midX=(aL.x+aR.x)/2;

    if(midX < -cardW*1.15 || midX > W+cardW*1.4){
      if(c.visible){ c.visible=false; c.mesh.visible=false; c.threadL.visible=c.threadR.visible=false; c.ringL.visible=c.ringR.visible=false; }
      c.pmx=midX; continue;
    }
    if(!c.visible){ c.visible=true; c.mesh.visible=true; c.threadL.visible=c.threadR.visible=true; c.ringL.visible=c.ringR.visible=true; c.pmx=midX; c.theta=0; c.thetaV=0; }

    const ropeAng=Math.atan2(aR.y-aL.y, aR.x-aL.x);

    /* both loops swing together, so the threads stay parallel */
    const vxx=(midX-c.pmx)/dt, acc=(vxx-c.pvx)/dt;
    c.pvx=vxx; c.pmx=midX;
    
    /* Stronger wind area for cards that have passed Spider-Man (midX < humanX) */
    const isPassed = midX < humanX + cardW * 0.1;
    if(!reduced){
      const windMult  = isPassed ? 3.4 : 1.0;
      const windFreq  = isPassed ? 3.8 : 1.9;
      const swingKMult= isPassed ? 0.65 : 1.0;
      const windTorque= gust * 2.6 * windMult * (0.7 + 0.5 * Math.sin(T * windFreq + c.phase));
      c.thetaV += (-CFG.card.swingK * swingKMult * c.theta - CFG.card.swingDamp * c.thetaV
                   - acc * CFG.card.swingInertia + windTorque) * dt;
      c.theta = clamp(c.theta + c.thetaV * dt, -CFG.card.maxSwing * 1.4, CFG.card.maxSwing * 1.4);
    } else c.theta = 0;

    const downAng=ropeAng*0.55+Math.PI/2+c.theta;
    const dnx=Math.cos(downAng), dny=Math.sin(downAng);   // "down" for this card
    const sdx=-dny, sdy=dnx;                              // along its width

    /* cloth vertices: u across the width, v down from the pinned top edge */
    const cl=c.cloth, pos=cl.geo.attributes.position.array;
    /* cards that passed Spider-Man experience stronger wind billow amplitude */
    const windEPassed = isPassed ? windE * 2.2 : windE;
    const amp=Math.min(cardH*CFG.card.waveAmp, cardW*0.085)*clamp(windEPassed,0,2.4);
    const lenU=clamp(3.2*(cardW/cardH), 5, CFG.card.waveLenU);
    const ph0=T*CFG.card.waveSpeed+c.phase;
    const spanArc=span*lenRatio;
    for(let i=0;i<=cl.segX;i++){
      const uu=i/cl.segX;
      /* the top edge rides the actual rope curve between the two loops */
      const top=atLength(sMid-half+uu*spanArc);
      const uEnv=Math.sin(Math.PI*uu);                    // zero at the pinned corners
      for(let j=0;j<=cl.segY;j++){
        const vv=j/cl.segY;
        const dist=threadLen+vv*cardH;
        /* cloth hangs BACK from the line as it descends: physically right for laundry, and
           it keeps the sheet strictly behind the character's legs instead of through them */
        const rake = -CFG.card.rake*Math.pow(vv, 0.85);
        let px=top.x+dnx*dist, py=top.y+dny*dist, pz=0;
        if(!reduced){
          /* ramps away from the pinned top edge and corners, but never fully dies, so
             folds travel through the whole cloth instead of only the hem */
          const env=(0.12+0.88*Math.pow(vv,0.95))*(0.25+0.75*uEnv);
          const phase=ph0+uu*lenU-vv*CFG.card.waveLenV;
          const w1=Math.sin(phase), w2=Math.sin(phase*1.73+1.1);
          pz=amp*env*(w1*0.90+w2*0.34);
          /* billowing shortens the cloth in plane and lifts the free edge */
          /* in-plane billow: the cloth gathers sideways and its free edge rides up and
             down, which is what actually reads as wind from the front */
          const shrink=amp*0.26*env*Math.cos(phase);
          const rise  =amp*0.24*env*Math.sin(phase+0.9);
          px += sdx*shrink + dnx*(rise - Math.abs(pz)*0.16);
          py += sdy*shrink + dny*(rise - Math.abs(pz)*0.16);
          /* the bottom corners furl */
          const curl=CFG.card.curl*amp*Math.pow(vv,2.2)*(uu<0.5 ? (0.5-uu) : (uu-0.5))*2;
          pz += curl*Math.sin(ph0*0.7+uu*3.1);
        }
        const o=(j*cl.nx+i)*3;
        pos[o]=vx(px); pos[o+1]=vy(py); pos[o+2]=rake + Math.min(pz, vv>0.25 ? 0 : pz);
      }
    }
    cl.geo.attributes.position.needsUpdate=true;
    cl.geo.computeVertexNormals();

    /* card weight pulls the line down where it hangs */
    const wgt=CFG.card.weight;
    addForceAt(aL, dnx*wgt*0.5, dny*wgt);
    addForceAt(aR, dnx*wgt*0.5, dny*wgt);

    /* loops on the rope + threads down to the cloth's own top corners */
    const cornerL={ x:pos[0], y:pos[1], z:pos[2] };
    const cornerR={ x:pos[cl.segX*3], y:pos[cl.segX*3+1], z:pos[cl.segX*3+2] };
    setRing(c.ringL, aL); setRing(c.ringR, aR);
    setThread(c.threadL, aL, cornerL);
    setThread(c.threadR, aR, cornerR);
  }
}
function setRing(m, a){
  m.position.set(vx(a.x), vy(a.y), 0);
  m.rotation.set(0, Math.PI/2, -a.ang);
  m.scale.setScalar(Math.max(0.6, threadLen/22));
}
function setThread(g, a, corner){
  const ax=vx(a.x), ay=vy(a.y);
  const dx=corner.x-ax, dy=corner.y-ay;
  const len=Math.hypot(dx,dy)||1;
  g.position.set(ax, ay, corner.z*0.5);
  g.rotation.z=Math.atan2(dy,dx);
  g.scale.set(len/10, Math.max(0.5, threadLen/26), Math.max(0.5, threadLen/26));
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now(), acc=0, ready=false;
const FIXED=1/60;
window.__jerry = { rope, cards, CFG, HUMAN, rings, SPEECH, reduced,
  simStep: () => tick(FIXED),
  ropeStep: () => drawRope(),
  renderInfo: () => ({ triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, programs: renderer.info.programs.length }),
  get state(){ return {ready,W,H,cardW,cardH,step,scroll,index,T,u,effort,effortS,gust,
    haulTravel,slackPay,leanS,gripL:gripS.Left,gripR:gripS.Right,footDrift,
    footOffL:footOff.Left,footOffR:footOff.Right,stepping:STEP.active,stepSide:STEP.side}; } };

function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,1/20);
  requestAnimationFrame(frame);
  /* boot can land on a 0x0 stage (fonts still loading, layout not settled yet); rather than
     wait on the ResizeObserver alone, keep retrying every frame until it takes */
  if(!ready){ build(); return; }
  if(step<=0) return;
  acc+=dt;
  let steps=0;
  while(acc>=FIXED && steps<4){ tick(FIXED); acc-=FIXED; steps++; }
  drawRope();
  renderer.render(scene, camera);
}

function tick(dt){
  T+=dt;
  nextGust-=dt;
  if(nextGust<=0){ nextGust=1.6+Math.random()*3.2; gustTarget=0.22+Math.random()*0.62; }
  gust=lerp(gust, gustTarget, 1-Math.pow(0.001,dt));

  const prev=lastScroll;
  if(!drag.active && !reduced){
    const a=(target-scroll)*CFG.motion.springK - scrollV*CFG.motion.springDamp;
    scrollV+=a*dt; scroll+=scrollV*dt;
  } else if(!drag.active && reduced){
    scroll=lerp(scroll, target, 1-Math.pow(0.0005,dt));
    scrollV=(scroll-prev)/dt;
  } else scrollV=(scroll-prev)/dt;
  const dScroll=scroll-prev;
  lastScroll=scroll;

  const idx=((Math.round(scroll/step)%DATA.length)+DATA.length)%DATA.length;
  if(idx!==index){
    index=idx;
    dots.forEach((d,i)=>d.setAttribute("aria-current", i===index?"true":"false"));
    syncWallpaperWithIndex(index);
    document.dispatchEvent(new CustomEvent("spidey:cardchange", { detail:{ index } }));
  }

  const speedE=clamp(Math.abs(scrollV)/(step*1.2),0,1);
  const holdE=drag.active ? clamp(Math.abs(drag.dx)/(step*0.35),0,1)*0.95 : 0;
  effort=Math.max(speedE, holdE);
  effortS=lerp(effortS, effort, 1-Math.pow(0.0001,dt));

  haulTravel += dScroll*lenRatio;                       // rope run through her hands
  slackPay = Math.max(0, slackPay + Math.max(0,dScroll)*0.11 - slackPay*2.2*dt);
  slackPay = Math.min(slackPay, H*0.16);
  u += (dScroll/(step/CFG.motion.cyclesPerCard));
  u = ((u%1)+1)%1;

  blinkAt-=dt;
  if(blinkAt<=0){ blinkAt=2.4+Math.random()*3.4; blink=1; }
  blink=Math.max(0, blink-dt*7.5);
  nextTwitch-=dt;
  if(nextTwitch<=0){ nextTwitch=2.6+Math.random()*4; earTwitch=1; }
  earTwitch=Math.max(0, earTwitch-dt*5.5);

  if(HUMAN.ready) poseHuman(dt);
  placeCards(dt);
  stepRope(dt, reduced ? 0 : gust, effortS);
  stepParticles(dt);
  speechTick(dt);
  stepRings(dt);
  stepMic(dt);
}

/* =====================================================================
   BOOT
   ===================================================================== */
function build(){
  if(!layout()) return false;
  anchorL={ ...anchorBase };
  for(let i=0;i<90;i++){ if(HUMAN.ready) poseHuman(FIXED); placeCards(FIXED); stepRope(FIXED, 0.2, 0); }
  drawRope();
  renderer.render(scene, camera);
  ready=true;
  return true;
}
function init(){
  dots.forEach((d,i)=>d.setAttribute("aria-current", i===0?"true":"false"));
  announce(0);
  build();
  requestAnimationFrame(frame);
}
/* the stage can measure 0x0 (hidden tab, zero-width preview pane, late fonts): the observer
   both boots us late and keeps the geometry honest afterwards */
let rzT;
new ResizeObserver(() => {
  clearTimeout(rzT);
  rzT=setTimeout(() => {
    if(!ready){ build(); return; }
    const frac=step ? scroll/step : 0;
    if(!layout()) return;
    anchorL={ ...anchorBase };
    scroll=frac*step; target=Math.round(frac)*step; scrollV=0;
  }, 120);
}).observe(stage);

/* ---------- 1 Wallpaper Scene (Golden Gate Bridge) ---------- */
const WALLPAPERS = [
  { label: 'Golden Gate Bridge', url: 'assets/golden-gate.jpg', author: 'Joseph Barrientos' },
];

let currentWpIndex = -1;
function syncWallpaperWithIndex(idx){
  const wp = WALLPAPERS[0];
  const backdropEl = document.getElementById('backdrop');
  const creditEl = document.getElementById('imageCredit');
  if(backdropEl){
    backdropEl.style.backgroundImage = `url('${wp.url}')`;
  }
  if(creditEl){
    creditEl.textContent = `Image Courtesy: ${wp.author}`;
  }
}

/* The puller is a base64 GLB standing in for the character if spiderman.glb ever fails. It used
   to load from a blocking <script> tag in the head, which cost every visitor 2.2MB of parse on
   every load to service a path that, for a local file on the same origin, never runs. Fetch it
   on demand instead — the failure path can afford one extra round trip. */
function loadPullerFallback(){
  const s = document.createElement("script");
  s.src = "assets/puller.glb.js";
  s.onload = () => {
    if(!window.__PULLER_GLB_B64){ console.error("puller data missing after load"); return; }
    try {
      const bin = Uint8Array.from(atob(window.__PULLER_GLB_B64), c => c.charCodeAt(0)).buffer;
      new THREE.GLTFLoader().parse(bin, "", initHuman, err2 => console.error("puller failed to parse", err2));
    } catch(err2){ console.error("puller decode failed", err2); }
  };
  s.onerror = err => console.error("puller.glb.js failed to load", err);
  document.head.appendChild(s);
}

/* Load character (Spider-Man GLB model with fallback to puller) */
try {
  new THREE.GLTFLoader().load('assets/spiderman.glb', initHuman, undefined, err => {
    console.warn("spiderman.glb failed to load, using default puller fallback", err);
    loadPullerFallback();
  });
} catch(err){ console.error("GLTFLoader execution error", err); }

/* Load the studio mic. Non-blocking on purpose: micMesh already holds the procedural build, so
   a Play that lands before this arrives just plays that round with the fallback. */
try {
  new THREE.GLTFLoader().load('assets/Mic.glb', initMic, undefined, err => {
    console.warn("Mic.glb failed to load, keeping procedural microphone", err);
  });
} catch(err){ console.error("mic GLTFLoader execution error", err); }

/* ---------- Play control: reads the testimony currently centred on the line ---------- */
const playBtn   = document.getElementById('playBtn');
const playLabel = document.getElementById('playLabel');

/* The label names the speaker it will actually read, so the control is unambiguous while
   several quotes are on screen at once. `index` is the card the line has settled on — the
   dominant one — so this always matches what a Play press would speak. Re-rendered both when
   the speech engine changes state and when the carousel lands on a new card. */
function renderPlayControl(){
  if(!playBtn) return;
  const speaking = SPEECH.speaking;
  const k = ((index % DATA.length) + DATA.length) % DATA.length;
  const d = DATA[k] || DATA[0];
  playBtn.classList.toggle('is-playing', speaking);
  playBtn.setAttribute('aria-pressed', speaking ? 'true' : 'false');
  playBtn.setAttribute('aria-label',
    (speaking ? 'Stop testimony from ' : 'Play testimony from ') + d.name + ', ' + d.role);
  if(playLabel){
    playLabel.textContent = (speaking ? 'Stop Testimony — ' : 'Play Testimony — ') + d.name;
    playLabel.title = d.name + ', ' + d.role;
  }
  if(dots && dots.length){
    dots.forEach((b, i) => {
      const active = i === k;
      b.setAttribute('aria-selected', active ? 'true' : 'false');
      b.setAttribute('aria-current', active ? 'true' : 'false');
    });
  }
}
/* speechStop/speechSpeak reach this through speechUI, including when an utterance ends on its
   own or the browser cancels it. State is read from SPEECH rather than the argument. */
function onSpeechState(){ renderPlayControl(); }

const playOverlay = document.querySelector('.play-controls-overlay');
const togglePlay = (e) => {
  if(e) e.stopPropagation();
  if(SPEECH.speaking) speechStop();
  else speechSpeak(index);
};
if(playBtn) playBtn.addEventListener('click', togglePlay);
if(playOverlay) {
  playOverlay.style.cursor = 'pointer';
  playOverlay.addEventListener('click', togglePlay);
}
if(SPEECH.supported && "speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
  window.speechSynthesis.getVoices();
}
renderPlayControl();

/* hauling to another card should not leave the previous quote still being read, and the label
   has to follow the new dominant card whether or not anything was playing */
document.addEventListener('spidey:cardchange', () => {
  if(SPEECH.speaking) speechStop();
  renderPlayControl();
});

if(typeof ResizeObserver !== "undefined"){
  const ro = new ResizeObserver(() => {
    if(ready){
      const frac = step ? scroll / step : 0;
      layout();
      scroll = frac * step;
      target = Math.round(frac) * step;
    }
  });
  ro.observe(stage);
}

init();
}
})();
</script>
